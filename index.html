<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say something to me · Anonymous Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--txt:#f4efff;--mut:#c9bfe6;--glass:rgba(255,255,255,.09);--bd:rgba(255,255,255,.22);--glow:#ff9ecb}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font-family:"Hind Siliguri","Poppins",sans-serif;background:linear-gradient(180deg,#070b33 0%,#1d1a68 28%,#5a2f8c 52%,#c4478f 74%,#ff9a6e 92%,#ffc88a 100%) fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.comet{position:absolute;top:8%;left:-20%;width:160px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,220,180,.9));transform:rotate(25deg);animation:comet 9s linear infinite;filter:drop-shadow(0 0 8px #ffd9a8)}
.comet::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 14px 5px #ffd9a8}
@keyframes comet{0%{transform:translate(0,0) rotate(25deg);opacity:0}6%{opacity:1}35%{transform:translate(130vw,60vh) rotate(25deg);opacity:0}100%{opacity:0;transform:translate(130vw,60vh) rotate(25deg)}}
.cloud{position:absolute;width:260px;height:60px;border-radius:60px;background:rgba(255,200,220,.12);filter:blur(18px);animation:drift var(--s) linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(calc(100vw + 300px))}}
.pt{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffe6b8;box-shadow:0 0 8px #ffd08a;animation:up var(--s) linear infinite;opacity:0}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-105vh) translateX(40px);opacity:0}}
#city{position:fixed;left:0;right:0;bottom:0;width:100%;height:26vh;min-height:150px;z-index:0;pointer-events:none}
.win{animation:tw var(--d) ease-in-out infinite}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px 140px}
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
h1{font-size:clamp(2.1rem,8vw,4rem);margin:0;font-weight:600;text-shadow:0 0 30px rgba(255,158,203,.6);min-height:1.3em}
h1 i{display:inline-block;width:3px;height:.9em;background:var(--glow);margin-left:4px;vertical-align:-.1em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.nm{font-family:Poppins,sans-serif;font-size:clamp(1.4rem,5vw,2.2rem);font-weight:300;letter-spacing:.35em;background:linear-gradient(90deg,#ffd9a8,#ff9ecb,#b9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:520px;color:var(--mut);font-size:1.05rem;margin:0}
.btn{font:inherit;font-weight:500;color:#fff;border:1px solid var(--bd);border-radius:999px;padding:12px 26px;cursor:pointer;background:linear-gradient(135deg,rgba(255,120,180,.55),rgba(140,110,255,.55));backdrop-filter:blur(10px);transition:.3s;text-decoration:none;display:inline-block}
.btn:hover{box-shadow:0 0 28px rgba(255,158,203,.75);transform:translateY(-2px)}
.btn.sm{padding:8px 16px;font-size:.9rem;background:var(--glass)}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(10,5,50,.35)}
section{margin-top:56px}
h2{font-weight:600;font-size:1.6rem;margin:0 0 16px;text-align:center}
.card{padding:22px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:14px;padding:14px;outline:none;transition:.3s}
textarea{min-height:140px;resize:vertical}
textarea:focus,input:focus{border-color:var(--glow);box-shadow:0 0 18px rgba(255,158,203,.4)}
::placeholder{color:#b3a8d6}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:14px}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.tg input{display:none}
.sw{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;transition:.3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s}
.tg input:checked+.sw{background:#ff7eb6}
.tg input:checked+.sw::after{left:23px}
#nameWrap{margin-top:14px;transition:.3s;overflow:hidden}
#nameWrap.h{max-height:0;margin:0;opacity:0}
#ok{text-align:center;margin-top:14px;color:#ffd0e6;min-height:1.5em;font-weight:500}
.wall{columns:2 260px;column-gap:18px}
.note{break-inside:avoid;margin:0 0 18px;padding:18px;border-radius:20px;border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both,fl var(--f) ease-in-out infinite alternate;transition:transform .3s,box-shadow .3s}
.note:hover{transform:rotate(-2deg) translateY(-6px) scale(1.02);box-shadow:0 14px 40px rgba(255,158,203,.35)}
.note p{margin:0 0 12px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.note small{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:.8rem}
.t0{background:rgba(255,150,200,.18)}.t1{background:rgba(130,180,255,.18)}.t2{background:rgba(180,140,255,.2)}.t3{background:rgba(130,240,200,.16)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes fl{from{translate:0 0}to{translate:0 -8px}}
.empty{text-align:center;color:var(--mut);padding:30px}
.mk{display:flex;gap:10px;flex-wrap:wrap}
.mk input{flex:1 1 200px}
#lk{display:none;margin-top:18px;text-align:center}
#lk .url{word-break:break-all;color:#ffd9a8;font-family:Poppins,sans-serif;margin:10px 0}
#lk .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fly{position:fixed;font-size:2rem;z-index:20;pointer-events:none;filter:drop-shadow(0 0 12px #ff9ecb)}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin-top:40px}
#home{display:none;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
.tabs{display:flex;gap:10px;justify-content:center;margin-top:30px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0}
.tabs button{font:inherit;color:var(--txt);border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(12px);border-radius:999px;padding:10px 20px;cursor:pointer;transition:.3s}
.tabs button.on{background:linear-gradient(135deg,rgba(255,120,180,.6),rgba(140,110,255,.6));box-shadow:0 0 22px rgba(255,158,203,.6)}
.tiamat{position:absolute;right:-3%;top:5%;width:min(640px,95vw);filter:drop-shadow(0 0 16px #ffc7e6);animation:tdr 16s ease-in-out infinite alternate}
@keyframes tdr{from{transform:translate(0,0)}to{transform:translate(-34px,20px)}}
.tiamat .b{animation:tw 3.5s ease-in-out infinite}
.rib{position:absolute;left:4%;top:34%;width:230px;opacity:0;animation:rb 11s ease-in-out infinite;filter:drop-shadow(0 0 6px #ff4d6d)}
@keyframes rb{0%{transform:translate(-40px,30px) rotate(-10deg);opacity:0}15%{opacity:.95}100%{transform:translate(75vw,-60px) rotate(16deg);opacity:0}}

let slug='emon';
function profile(){const h=location.hash.slice(1);slug=/^u-[a-z0-9-]+$/.test(h)?h:'emon';
 if(!DB[slug])DB[slug]={name:slug==='emon'?'maybdeath4all':slug.slice(2).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()),notes:[]};if(slug==='emon')DB[slug].name='maybdeath4all';return DB[slug]}
const when=t=>new Date(t).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});

/* typewriter */
let tw=0;
function type(text){const id=++tw,seg=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter('en',{granularity:'grapheme'}).segment(text)].map(x=>x.segment):Array.from(text);const el=$('#hl');let i=0,dir=1;
 (function step(){if(id!==tw)return;el.innerHTML=seg.slice(0,i).join('')+'<i></i>';
  if(dir>0&&i===seg.length){dir=-1;return setTimeout(step,3200)}
  if(dir<0&&i===0){dir=1;return setTimeout(step,600)}
  i+=dir;setTimeout(step,dir>0?110:45)})()}

function noteEl(n,i,fresh){const d=document.createElement('div');d.className='note t'+(i%4);d.style.setProperty('--f',(3+(i%5))+'s');if(!fresh)d.style.animationDelay=(i*60)+'ms,0s';
 const p=document.createElement('p');p.textContent=n.text;const s=document.createElement('small');const a=document.createElement('span'),b=document.createElement('span');a.textContent='— '+(n.name||'Anonymous')+(n.code?' · '+n.code:'');b.textContent=when(n.t);s.append(a,b);d.append(p,s);return d}
function render(){const P=profile(),w=$('#wall');w.innerHTML='';
 if(!P.notes.length){w.innerHTML='<div class="empty glass">No notes yet. Be the first to write one 🌠</div>'}
 else P.notes.forEach((n,i)=>w.appendChild(noteEl(n,i)));
 const own=slug==='emon';$('#owner').textContent=P.name.toUpperCase();$('#home').style.display=own?'none':'inline-block';$('#tB').textContent='📬 Inbox ('+P.notes.length+')';
 type(own?'Say something to me...':'Say something to '+P.name+'...');$('#ok').textContent='';watchRemote()}
addEventListener('hashchange',()=>{render();if(location.hash!=='#compose')scrollTo(0,0)});

/* anon toggle */
$('#anon').onchange=e=>$('#nameWrap').classList.toggle('h',e.target.checked);

/* send */
$('#send').onclick=()=>{const m=$('#msg').value.trim(),ok=$('#ok');
 if(!m){ok.textContent='Write something first 🙂';return}
 const anon=$('#anon').checked,name=anon?'':$('#from').value.trim().slice(0,30);
 const P=profile(),n={text:m,name:name||'Anonymous',code:devCode(),t:Date.now()};
 const fly=document.createElement('div');fly.className='fly';fly.textContent='💌';document.body.appendChild(fly);
 const a=$('#send').getBoundingClientRect(),b=$('#tB').getBoundingClientRect();
 const x0=a.left+a.width/2,y0=a.top,x1=b.left+b.width/2,y1=Math.max(60,b.top+40);
 fly.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-70}px) scale(1.5) rotate(12deg)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.6)`,opacity:0}],{duration:1000,easing:'ease-in-out'}).onfinish=()=>{
  fly.remove();if(FB){FB.collection('pages').doc(slug).collection('notes').add(n).catch(()=>{P.notes.unshift(n);save();render()})}else{P.notes.unshift(n);save();render()}$('#ok').textContent='Your note has been delivered! 💖'};
 $('#msg').value='';};

/* create link */
let link='';
$('#mkb').onclick=()=>{const n=$('#mine').value.trim();if(!n)return $('#mine').focus();
 const s=slugOf(n);if(!DB[s])DB[s]={name:n,notes:[]};save();
 link=location.href.split('#')[0]+'#'+s;$('#url').textContent=link;$('#go').href='#'+s;$('#lk').style.display='block'};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#cp').textContent='✅ Copied!'}catch(e){const t=document.createElement('textarea');t.value=link;document.body.appendChild(t);t.select();try{document.execCommand('copy');$('#cp').textContent='✅ Copied!'}catch(_){$('#cp').textContent='Copy the link manually'}t.remove()}setTimeout(()=>$('#cp').textContent='📋 Copy Link',2000)};
$('#fb').onclick=()=>window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link),'_blank');
$('#wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Write me a note 💌 '+link),'_blank');
$('#wb').onclick=e=>{e.preventDefault();$('#compose').scrollIntoView({behavior:'smooth'})};
function devCode(){let d;try{d=localStorage.getItem('yn_dev');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('yn_dev',d)}}catch(e){d=Math.random().toString(36).slice(2,8)}
let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;const A=['Moon','Comet','Star','Cloud','Wind','Dream','Sakura','Aurora'],B=['🌙','☄️','⭐','☁️','🍃','💭','🌸','🌌'];return B[h%8]+' '+A[(h>>3)%8]+'-'+(1000+h%9000)}
function side(s){$('#sideA').style.display=s==='A'?'':'none';$('#sideB').style.display=s==='B'?'':'none';$('#tA').classList.toggle('on',s==='A');$('#tB').classList.toggle('on',s==='B')}
$('#tA').onclick=()=>side('A');$('#tB').onclick=()=>side('B');
render();
</script>
</body>
</html>
